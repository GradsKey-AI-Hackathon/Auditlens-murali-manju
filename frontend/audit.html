<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit History — Audit Lens</title>
<link rel="stylesheet" href="/css/audit.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" onclick="location.href='index.html'"><span class="logo-mark">A</span><span class="logo-text">Audit<span>Lens</span></span></div>
    <div class="nav" id="topNav"></div>
    <div class="user-box">
      <span class="role-badge" id="roleBadge">USER</span>
      <span class="user-email" id="userEmail">—</span>
      <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main>
  <div class="page-head">
    <div>
      <div class="page-title">Audit History</div>
      <div class="page-sub">AI-powered audit trail of every vendor invoice reconciled against purchase orders.</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;" id="topCTA"></div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-view="history">Audit Log</div>
    <div class="tab" id="scoreTab" data-view="score">Vendor Score</div>
  </div>

  <!-- HISTORY VIEW -->
  <section id="view-history">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="filters" id="filters">
        <div class="filter-chip active" data-status="all">All</div>
        <div class="filter-chip" data-status="CLEAR">CLEAR</div>
        <div class="filter-chip" data-status="DISCREPANCY">DISCREPANCY</div>
      </div>
      <input type="text" class="search-box" id="searchBox" placeholder="Search by PO, invoice, vendor..." />
    </div>

    <div id="historyContainer">
      <!-- Populated by JS -->
    </div>
  </section>

  <!-- SCORE VIEW -->
  <section id="view-score" style="display:none;">
    <div id="scoreContainer">
      <!-- Populated by JS -->
    </div>
  </section>
</main>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="detailTitle">Audit Details</h2>
      <button class="close-x" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body" id="detailBody">
      <div class="skeleton" style="height:200px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeDetail()">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- CONFIG -->
<script src="/js/config.js"></script>
<script src="/js/audit.js"></script>
</body>
</html>
